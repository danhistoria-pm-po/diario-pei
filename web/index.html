<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Diário PEI — Gestão de Plano Educacional Individualizado e Diário de Bordo escolar.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Diário PEI">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Diário PEI</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    function _escapeHtml(texto) {
      return String(texto || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function _formatarDataHojePtBr() {
      const hoje = new Date();
      const dia = String(hoje.getDate()).padStart(2, '0');
      const mes = String(hoje.getMonth() + 1).padStart(2, '0');
      const ano = hoje.getFullYear();
      return dia + '/' + mes + '/' + ano;
    }

    function _montarHtmlParecer(nomeEscola, nomeAluno, turma, conteudoTexto, paraWord) {
      const escolaSegura = _escapeHtml(nomeEscola).trim();
      const alunoSeguro = _escapeHtml(nomeAluno);
      const turmaSegura = _escapeHtml(turma);
      const textoSeguro = _escapeHtml(conteudoTexto).replace(/\r?\n/g, '<br>');
      const dataAtual = _formatarDataHojePtBr();

      const ns = paraWord
        ? ' xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40"'
        : '';

      const pageRule = paraWord
        ? '@page { size: A4; margin: 20mm; }'
        : '@page { size: A4; margin: 0; }';

      const bodyPadding = paraWord ? '24px' : '18mm';
      const printBodyPadding = paraWord ? '0' : '18mm';

      const blocoEscola = escolaSegura
        ? '<div class="escola">' + escolaSegura + '</div>'
        : '';

      return '<!DOCTYPE html>' +
        '<html lang="pt-BR"' + ns + '>' +
        '<head>' +
        '<meta charset="utf-8">' +
        '<title>PEI - ' + alunoSeguro + '</title>' +
        '<style>' +
        pageRule +
        'body { font-family: Arial, Helvetica, sans-serif; color: #1f2937; line-height: 1.55; font-size: 11.5pt; margin: 0; padding: ' + bodyPadding + '; box-sizing: border-box; }' +
        '.header { border-bottom: 2px solid #1F6F78; padding-bottom: 12px; margin-bottom: 18px; }' +
        '.escola { font-size: 12pt; font-weight: 700; color: #111827; text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 4px; }' +
        '.header h1 { font-size: 15pt; margin: 0 0 6px 0; color: #1F6F78; }' +
        '.meta { font-size: 10.5pt; color: #374151; margin: 2px 0; }' +
        '.conteudo { margin-top: 16px; min-height: 320px; text-align: left; }' +
        '.assinaturas { margin-top: 64px; width: 100%; border-collapse: collapse; }' +
        '.assinaturas td { width: 100%; text-align: center; padding: 0; vertical-align: bottom; }' +
        '.linha { display: inline-block; width: 280px; border-top: 1px solid #374151; padding-top: 6px; font-size: 10pt; color: #374151; text-align: center; }' +
        '@media print { body { padding: ' + printBodyPadding + '; } }' +
        '</style>' +
        '</head>' +
        '<body>' +
        '<div class="header">' +
        blocoEscola +
        '<h1>Plano Educacional Individualizado - Parecer Pedagógico</h1>' +
        '<div class="meta"><strong>Aluno(a):</strong> ' + alunoSeguro + '</div>' +
        '<div class="meta"><strong>Turma:</strong> ' + turmaSegura + ' &nbsp;|&nbsp; <strong>Data:</strong> ' + dataAtual + '</div>' +
        '</div>' +
        '<div class="conteudo">' + textoSeguro + '</div>' +
        '<table class="assinaturas"><tr>' +
        '<td align="center"><div class="linha">Coordenação Pedagógica / AEE</div></td>' +
        '</tr></table>' +
        '</body>' +
        '</html>';
    }

    function exportarParecerDoc(tituloArquivo, nomeEscola, nomeAluno, turma, conteudoTexto) {
      const html = _montarHtmlParecer(nomeEscola, nomeAluno, turma, conteudoTexto, true);
      const blob = new Blob(['\ufeff' + html], {
        type: 'application/msword;charset=utf-8'
      });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = tituloArquivo.endsWith('.doc')
        ? tituloArquivo
        : tituloArquivo + '.doc';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      setTimeout(function () {
        URL.revokeObjectURL(url);
      }, 1000);
    }

    function exportarParecerPdf(nomeEscola, nomeAluno, turma, conteudoTexto) {
      const html = _montarHtmlParecer(nomeEscola, nomeAluno, turma, conteudoTexto, false);
      const iframe = document.createElement('iframe');
      iframe.style.position = 'fixed';
      iframe.style.right = '0';
      iframe.style.bottom = '0';
      iframe.style.width = '0';
      iframe.style.height = '0';
      iframe.style.border = '0';
      iframe.style.visibility = 'hidden';
      document.body.appendChild(iframe);

      const removerIframe = function () {
        if (iframe.parentNode) {
          iframe.parentNode.removeChild(iframe);
        }
      };

      const doc = iframe.contentWindow.document;
      doc.open();
      doc.write(html);
      doc.close();

      iframe.contentWindow.onafterprint = removerIframe;

      setTimeout(function () {
        iframe.contentWindow.focus();
        iframe.contentWindow.print();
      }, 250);
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
